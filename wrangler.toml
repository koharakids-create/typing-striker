name = "typing-striker"
main = "worker.js"
compatibility_date = "2025-06-01"

# ファイルが すべて いちばん上に ある 形で 配信します
# （配信しないファイルは .assetsignore に書いてあります）
[assets]
directory = "."
binding = "ASSETS"

# オンライン対戦の「へや」（1へや = 1 Durable Object）
[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

# 無料プランでも使える SQLite 版 Durable Object
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]
